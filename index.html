 if(state.tab==='inventory'){c.innerHTML='<div class="row" style="margin-bottom:10px"><p class="panel-note" style="margin:0">戰鬥中的戰利品會自動收集。</p><span class="gold">'+state.inventory.length+' 件</span></div>'+(state.inventory.length?state.inventory.slice().reverse().map((it,idx)=>{const real=state.inventory.length-1-idx;return '<div class="item"><div class="itemicon">'+it.icon+'</div><div class="iteminfo"><b class="'+(it.rarity||'rare')+'">'+it.name+'</b><small>'+it.desc+(it.kind==='gear'?' · '+it.sockets+' 插槽':'')+'</small></div>'+(it.kind==='gear'?'<button class="action" data-equip="'+real+'">裝備</button>':'<button class="action" data-gem="'+real+'">鑲嵌</button>')+'</div>'}).join(''):'<div class="card"><h3>背包空空如也</h3><p class="muted">繼續戰鬥，裝備與輔助寶石將會陸續掉落。</p></div>')+'<div class="card"><div class="row"><div><h3>自動拾取</h3><span class="muted">戰鬥中自動收集掉落物</span></div><button class="action" id="lootToggle">'+(state.autoLoot?'已開啟':'已關閉')+'</button></div></div>'}
 if(state.tab==='skills'){c.innerHTML='<p class="panel-note">主動技能來自職業技能庫，不需要靠怪物掉落取得。角色會依照戰鬥情境自動施放。</p><div class="card"><h3>'+jobs[state.job].name+' · 職業技能</h3><div class="skillgrid">'+skillBook.slice(0,6).map((s,i)=>'<div class="skillcard"><span class="big">'+s[1]+'</span><b>'+s[0]+'</b><p>'+s[2]+'</p><span class="muted">'+(i<3?'已配置':'技能庫')+'</span></div>').join('')+'</div></div><div class="card"><h3>自動施放邏輯</h3><p class="muted">範圍技能優先對付群怪，單體技能優先攻擊精英與首領；防禦技能會在生命危急時觸發。這是第一版的自動戰鬥規則。</p></div>'}
 if(state.tab==='talents'){c.innerHTML='<p class="panel-note">升級獲得天賦點。第一版先提供可用的核心節點，之後擴展成完整的分支天賦網路。</p><div class="card"><div class="row"><h3>天賦點數</h3><span class="gold">'+state.talent+' 點可用</span></div><div style="display:flex;align-items:center;justify-content:center;gap:18px;padding:18px 0"><div class="node">✦</div><div style="color:#8e7958">━━</div><div class="node">⚔</div><div style="color:#8e7958">━━</div><div class="node">◈</div></div><div class="skillgrid"><div class="skillcard"><span class="big">⚔</span><b>武器精通</b><p>增加 5% 攻擊傷害。</p><button class="action" data-talent="damage" '+(state.talent<=0?'disabled':'')+'>投入天賦點</button></div><div class="skillcard"><span class="big">♥</span><b>堅韌血脈</b><p>增加 8% 最大生命。</p><button class="action" data-talent="life" '+(state.talent<=0?'disabled':'')+'>投入天賦點</button></div></div></div><div class="card"><h3>已投入天賦</h3><p class="muted">目前已投入 '+(state.talentSpent||0)+' 點。重置功能將在完整天賦樹階段加入。</p></div>'}
 if(state.tab==='stage'){c.innerHTML='<p class="panel-note">每章六個戰鬥區域。前五關清理怪物，第六關挑戰章節首領。已解鎖關卡可自由重複刷取。</p><div class="card"><h3>第一章 · 腐朽聖庭</h3>'+Array.from({length:6},(_,i)=>'<div class="item"><div class="itemicon">'+(i===5?'♛':'⚔')+'</div><div class="iteminfo"><b>'+(i+1)+'. '+['灰燼庭院','破碎迴廊','血色祈禱室','枯井墓園','聖庭深處','墮落王座'][i]+'</b><small>'+(i===5?'章節首領 · 專屬傳奇掉落池':'固定戰鬥區域 · 普通與精英怪物')+'</small></div><button class="action" data-stage="'+(i+1)+'">'+(state.stage===i+1?'目前':'進入')+'</button></div>').join('')+'</div><div class="card"><h3>難度</h3><p class="muted">目前原型開放基礎難度。更高難度與專屬詞綴將在核心循環穩定後加入。</p></div>'}
 c.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{state.job=b.dataset.job;toast('已切換至 '+jobs[state.job].name);save();renderPanel()});
 c.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{const it=state.inventory[+b.dataset.equip];if(!it||it.kind!=='gear')return;const old=state.gear[it.slot];state.gear[it.slot]=it;state.inventory.splice(+b.dataset.equip,1);if(old)state.inventory.push(old);toast('已裝備 '+it.name);save();renderPanel()});
 c.querySelectorAll('[data-gem]').forEach(b=>b.onclick=()=>{const gem=state.inventory[+b.dataset.gem];if(!gem||gem.kind!=='gem')return;for(const key of gearKeys){const item=state.gear[key];if(!item)continue;item.gems=item.gems||[];const slot=item.gems.findIndex((v,i)=>!v&&i<item.sockets);if(slot!==-1){item.gems[slot]=gem;state.inventory.splice(+b.dataset.gem,1);toast(gem.name+' 已鑲嵌至 '+item.name);save();renderPanel();return}}toast('目前沒有已裝備物品的空插槽')});
 c.querySelectorAll('[data-unsocket]').forEach(b=>b.onclick=()=>{const [key,index]=b.dataset.unsocket.split(',');const item=state.gear[key];if(item&&item.gems&&item.gems[+index]){state.inventory.push(item.gems[+index]);item.gems[+index]=null;toast('已取下輔助寶石');save();renderPanel()}});
 c.querySelectorAll('[data-unequip]').forEach(b=>b.onclick=()=>{const it=state.gear[b.dataset.unequip];if(it){state.inventory.push(it);state.gear[b.dataset.unequip]=null;save();renderPanel()}});
 c.querySelectorAll('[data-talent]').forEach(b=>b.onclick=()=>{if(state.talent<=0)return;state.talent--;state.talentSpent=(state.talentSpent||0)+1;if(b.dataset.talent==='damage')state.damageBonus=(state.damageBonus||0)+.05;else{state.maxHp=Math.round(state.maxHp*1.08);state.hp=state.maxHp}toast('天賦已強化');save();renderPanel()});
 c.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{state.stage=+b.dataset.stage;if(state.stage>(state.unlockedStage||1)){toast('尚未解鎖此關卡');return}state.enemies=[];state.boss=null;$('bossbar').classList.remove('show');state.spawn=.3;if(state.stage===6){enemySpawn(true)}toast('進入第 '+state.stage+' 關');save();renderPanel()});
 const lt=c.querySelector('#lootToggle');if(lt)lt.onclick=()=>{state.autoLoot=!state.autoLoot;renderPanel();save()};
}
setInterval(save,12000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('pagehide',save);
if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
toast('戰鬥開始 · 角色正在自動清理聖庭');
})();
</script>
</body></html>
