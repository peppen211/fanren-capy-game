.skills{display:flex;align-items:flex-end;gap:7px;pointer-events:auto;padding-bottom:2px}

.drawer-head{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(195,161,107,.2)}
.drawer-title{font:600 17px Cinzel,serif;letter-spacing:.1em;color:#e5d1a8}.close{border:1px solid #705d48;background:#211b1b;border-radius:8px;width:34px;height:30px;font-size:18px}
.tabs{display:flex;gap:0;overflow-x:auto;flex:none;border-bottom:1px solid rgba(195,161,107,.2);scrollbar-width:none}.tabs button{flex:1;min-width:65px;padding:12px 7px;background:none;border:0;border-bottom:2px solid transparent;color:#a99c8d;font-size:12px;white-space:nowrap}.tabs button.active{color:#e5ca91;border-bottom-color:#c6a36c;background:linear-gradient(0deg,rgba(197,158,99,.1),transparent)}
.panel-content{overflow:auto;padding:15px 16px 26px;flex:1;overscroll-behavior:contain}
.panel-note{color:#a99c8d;font-size:11px;line-height:1.7;margin:0 0 12px}
.card{border:1px solid rgba(191,158,107,.25);background:linear-gradient(135deg,rgba(45,37,38,.8),rgba(20,18,23,.85));border-radius:10px;padding:12px;margin-bottom:9px}
.card h3{margin:0 0 7px;color:#e1c58e;font-size:13px;font-weight:600}.muted{color:#a99c8d;font-size:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:10px;border-radius:8px;background:rgba(0,0,0,.2);border:1px solid rgba(191,158,107,.16)}.stat b{display:block;font:600 16px Cinzel;color:#e8d5b1}.stat span{font-size:10px;color:#a99c8d}
.action{border:1px solid #90734e;border-radius:7px;background:linear-gradient(180deg,#594533,#30251f);padding:7px 11px;font-size:11px;color:#f0dfbd}.action:disabled{opacity:.35}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(191,158,107,.12)}.item:last-child{border:0}.itemicon{width:40px;height:40px;flex:none;border:1px solid rgba(201,169,112,.45);border-radius:8px;display:grid;place-items:center;font-size:21px;background:radial-gradient(circle,#55413a,#17141a)}.iteminfo{min-width:0;flex:1}.iteminfo b{display:block;font-size:12px}.iteminfo small{font-size:10px;color:#aa9d8d;line-height:1.5;display:block}
.gold{color:#e4c278}.rare{color:#77a9db}.epic{color:#c69ae4}.legend{color:#e5a45b}
.slotrow{display:flex;gap:5px;margin-top:6px}.socket{width:18px;height:18px;border:1px solid #9a805c;border-radius:50%;background:#17151b;box-shadow:inset 0 0 5px #000}.socket.filled{background:radial-gradient(circle,#e4c37d 0 25%,#77552e 50%,#17151b 72%)}
.skillgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.skillcard{padding:10px;border:1px solid rgba(191,158,107,.22);border-radius:9px;background:rgba(0,0,0,.2)}.skillcard .big{font-size:23px}.skillcard b{font-size:12px;display:block;margin:4px 0}.skillcard p{font-size:10px;color:#a99c8d;margin:0 0 8px;line-height:1.5}
.node{border:1px solid #8e754e;background:radial-gradient(circle,#6b5336,#201a1b 70%);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:17px;box-shadow:0 0 13px rgba(190,151,86,.15)}
.toast{position:absolute;z-index:20;left:50%;top:24%;transform:translate(-50%,-10px);background:rgba(17,14,18,.95);border:1px solid #9e8057;border-radius:8px;padding:9px 14px;font-size:11px;color:#ead7b2;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){#game{max-width:480px;margin:auto;border-left:1px solid #51402d;border-right:1px solid #51402d}.hud{max-width:480px;left:50%;right:auto;width:100%;transform:translateX(-50%)}.drawer{max-width:480px;left:50%;right:auto;width:100%;transform:translate(-50%,105%)}.drawer.open{transform:translate(-50%,0)}.panel-scrim{background:rgba(0,0,0,.38)}}
