<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111317">
<title>凡人仙途：Q版卡皮修仙錄</title>
<style>
:root{--bg:#111317;--panel:#1b1e26;--panel2:#252a37;--gold:#e0b15e;--jade:#38b2ac;--muted:#a0aec0;--red:#e56b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7fafc;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:1px solid #4a5568;background:#252a37;border-radius:10px;padding:10px;cursor:pointer}button:disabled{opacity:.4}
header{position:sticky;top:0;z-index:3;background:#191c24;border-bottom:1px solid #72572c;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}.pill{background:#101319;border:1px solid #41495a;border-radius:20px;padding:5px 9px;white-space:nowrap}.gold{color:var(--gold)}main{max-width:760px;margin:auto;padding:12px}.view{display:none}.view.active{display:block}.card{background:linear-gradient(145deg,#222631,#171a22);border:1px solid #66502c;border-radius:14px;padding:13px;margin-bottom:12px;box-shadow:0 5px 16px #0005}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.muted{color:var(--muted);font-size:12px}.big{font-size:22px;font-weight:800}.hero{text-align:center;padding:22px 12px;background:radial-gradient(circle,#30404b,#171a22 70%)}.avatar{font-size:68px;margin:8px}.slots,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{background:#11151c;border:1px solid #465064;border-radius:9px;padding:9px;text-align:center;font-size:12px;min-width:0}.slot b{display:block;color:var(--gold);margin-top:5px;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.primary{background:linear-gradient(135deg,#c6933d,#80591c);border-color:#ffe09e;font-weight:800}.jade{background:#234e52;border-color:#81e6d9}.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px;background:#151820;border-top:1px solid #66502c;padding-bottom:max(8px,env(safe-area-inset-bottom))}.tabs button.active{border-color:var(--gold);color:var(--gold)}.bar{height:9px;background:#303747;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--jade);width:100%}.enemy i{background:var(--red)}.list{display:grid;gap:8px}.item{background:#171b23;border:1px solid #424b5c;padding:10px;border-radius:9px}.item small{display:block;color:var(--muted);margin:4px 0}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.modalbox{max-width:440px;width:100%;background:#202530;border:1px solid var(--gold);border-radius:14px;padding:16px}.choice{display:block;width:100%;text-align:left;margin-top:8px}.log{min-height:52px;background:#10141b;border-radius:8px;padding:10px;font-size:13px;color:#d9e2ef}.section-title{margin:8px 0;color:var(--gold);font-weight:800}
@media(min-width:600px){main{padding:20px}.hero .avatar{font-size:88px}}
</style>
</head>
<body>
<header><strong>凡人仙途 <span class="gold">✦</span></strong><span class="pill" id="realm">凡人武者</span><span class="pill">🪨 <b id="stone">500</b></span><span class="pill">💎 <b id="gem">1200</b></span></header>
<main>
<section class="view active" id="home">
<div class="card hero"><div class="muted" id="stage">第一階段 · 七玄門初入江湖</div><div class="big" id="chapter">第1章：神手谷採藥</div><div class="muted" id="recommend">推薦境界：凡人武者</div><div class="avatar">🧑🏻‍🌾⚔️</div><div>韓立　　🐞 噬金蟲</div><div class="big gold" style="margin-top:8px">戰力 <span id="power">150</span></div></div>
<div class="card"><div class="row"><b>聚靈陣</b><span class="gold" id="afk">靈氣凝聚中</span></div><p class="muted">離線也會累積修煉資源。</p><button class="jade" style="width:100%" onclick="claimAfk()">領取聚靈收益</button></div>
<div class="card"><div class="section-title">本命三槽配裝</div><div class="slots"><div class="slot">主修武器<b id="weaponSlot">青竹蜂雲劍</b></div><div class="slot">隨行靈獸<b id="petSlot">噬金蟲</b></div><div class="slot">本命法寶<b id="artifactSlot">掌天瓶</b></div></div></div>
<div class="card"><div class="section-title">洞府修煉</div><div class="grid"><button onclick="upgrade('atk')">煉體·攻擊<br><span id="atkLv">Lv.1</span><small>50 靈石</small></button><button onclick="upgrade('hp')">養氣·氣血<br><span id="hpLv">Lv.1</span><small>50 靈石</small></button><button onclick="upgrade('def')">護脈·防禦<br><span id="defLv">Lv.1</span><small>50 靈石</small></button></div><button id="breakBtn" class="jade" style="display:none;width:100%;margin-top:9px" onclick="breakthrough()">靈氣圓滿！渡劫突破</button></div>
<div class="card"><div class="row"><button onclick="chapter(-1)">◀ 前章</button><b id="chapterCount">第 1 / 30 章</b><button onclick="chapter(1)">後章 ▶</button></div><button class="primary" style="width:100%;margin-top:12px" onclick="startRun()">出關歷練（60天推進）</button></div>
</section>
<section class="view" id="gear"><div class="card"><div class="big">法寶配裝</div><p class="muted">裝備決定流派。相同類別、名稱、階級的三件裝備可合成高一階。</p><button class="primary" style="width:100%" onclick="mergeItems()">一鍵三合一升階</button></div><div class="card"><div class="row"><b>背包分類</b><select id="filter" onchange="renderGear()"><option value="weapon">武器</option><option value="pet">靈獸</option><option value="artifact">本命法寶</option></select></div><div class="list" id="inventory"></div></div></section>
<section class="view" id="gacha"><div class="card"><div class="big">秘境尋寶</div><p class="muted">消耗極品靈石抽取裝備，十連抽九折。</p><div id="pools"></div></div></section>
<section class="view" id="battle"><div class="card"><div class="row"><b id="runChapter">第1章 歷練</b><span>第 <b id="day">1</b> / 60 天</span></div><div class="muted">局內靈石 +<b id="runStone">0</b>　流派：<b id="build">飛劍連擊流</b></div></div><div class="card"><div class="row"><b>韓立</b><b id="playerHpText">100 / 100</b></div><div class="bar"><i id="playerHp"></i></div><div class="row" style="margin-top:18px"><b id="enemyName">等待遭遇</b><b id="enemyHpText">--</b></div><div class="bar enemy"><i id="enemyHp" style="width:0%"></i></div><div class="avatar" id="enemyArt">🌲🐍</div><div class="log" id="battleLog">準備踏入歷練之地...</div><p class="muted">已領悟功法：<b id="skillCount">0</b></p><div class="actions"><button onclick="toggleSpeed()" id="speedBtn">倍速 1x</button><button onclick="showSkills()">局內功法</button><button onclick="pauseRun()" id="pauseBtn">暫停</button><button onclick="retreat()">撤離回府</button></div></div></section>
</main>
<nav class="tabs" id="nav"><button class="active" data-view="home" onclick="showView('home')">洞府修煉</button><button data-view="gear" onclick="showView('gear')">法寶配裝</button><button data-view="gacha" onclick="showView('gacha')">秘境尋寶</button></nav>
<div class="modal" id="modal"><div class="modalbox"><div class="big gold" id="modalTitle"></div><div id="modalBody"></div><button style="width:100%;margin-top:12px" onclick="closeModal()">確定</button></div></div>
<script>
const $=id=>document.getElementById(id);
const realms=['凡人武者','煉氣一層','煉氣二層','煉氣三層','煉氣四層','煉氣五層','煉氣六層','煉氣七層','煉氣八層','煉氣九層','煉氣十層','煉氣十一層','煉氣十二層','煉氣十三層','築基前期'];
const titles=['神手谷採藥','墨大夫考驗','長春功入門','力戰狂狼幫','初得掌天瓶','下山歷練','嘉元城風波','太南谷小會','坊市奪寶','金光上人','升仙令現世','荒野截殺','拜入黃楓谷','百藥園管事','修煉青元劍','宗門大比','禁地開啟','初入血色','靈藥爭奪','遭遇魔道','陣法困敵','聯手抗敵','深潭尋寶','激戰墨蛟','滿載而歸','閉關煉丹','丹成築基','服用築基丹','衝擊大瓶頸','道基初成'];
const templates={
weapon:[['sword','青竹蜂雲劍','飛劍連擊流','普攻連擊與追擊飛劍',18],['hammer','紫電金雷錘','神雷爆發流','普攻機率落雷',20],['ruler','玄鐵重尺','護盾反傷流','攻擊獲得護盾並反震',16]],
pet:[['beetle','噬金蟲','破甲連擊','每回合啃咬並破甲',10],['ghost','啼魂獸','吸靈控制','每三回合暈眩並回血',90],['wolf','銀月狼','暴擊秒殺','提高暴擊率',12]],
artifact:[['bottle','掌天瓶','靈液續航','大招回血並增攻',100],['wings','風雷翅','閃避反擊','大招三連斬',15],['cauldron','虛天鼎','乾藍焚天','大招冰焰重擊',18]]};
const quality=['凡器','靈器','法寶','古寶','通天靈寶','玄天之寶'];
let save={stone:500,gem:1200,realm:0,chapter:1,maxChapter:1,talents:{atk:1,hp:1,def:1},last:Date.now(),items:[{id:1,cat:'weapon',key:'sword',tier:0},{id:2,cat:'pet',key:'beetle',tier:0},{id:3,cat:'artifact',key:'bottle',tier:0}],eq:{weapon:1,pet:2,artifact:3},next:4};
try{const old=JSON.parse(localStorage.getItem('fanren-capy-save'));if(old)save={...save,...old,talents:{...save.talents,...old.talents},eq:{...save.eq,...old.eq}}}catch(e){}
let run=null,timer=null,paused=false,speed=1;
const meta=item=>{const t=templates[item.cat].find(x=>x[0]===item.key);return {key:t[0],name:t[1],build:t[2],desc:t[3],value:Math.floor(t[4]*Math.pow(1.6,item.tier)),tier:item.tier}};
function persist(){localStorage.setItem('fanren-capy-save',JSON.stringify(save))}
function stats(){let a=20+save.talents.atk*8+save.realm*25,h=160+save.talents.hp*55+save.realm*180,d=5+save.talents.def*3+save.realm*10,c=10;for(const cat of ['weapon','pet','artifact']){const it=save.items.find(x=>x.id===save.eq[cat]);if(!it)continue;const m=meta(it);if(cat==='weapon'||(cat==='pet'&&it.key!=='ghost')||(cat==='artifact'&&it.key!=='bottle'))a+=m.value;if((cat==='pet'&&it.key==='ghost')||(cat==='artifact'&&it.key==='bottle'))h+=m.value;if(it.key==='wolf')c+=18}return{atk:a,hp:h,def:d,crit:c}}
function refresh(){const s=stats(),ch=save.chapter; $('realm').textContent=realms[save.realm];$('stone').textContent=save.stone;$('gem').textContent=save.gem;$('stage').textContent=ch<=5?'第一階段 · 七玄門初入江湖':ch<=12?'第二階段 · 嘉元城與太南小會':ch<=18?'第三階段 · 加入黃楓谷宗門':ch<=25?'第四階段 · 血色禁地生死試煉':'第五階段 · 煉製築基丹衝關';$('chapter').textContent='第'+ch+'章：'+titles[ch-1];$('recommend').textContent='推薦境界：'+realms[Math.min(14,Math.floor((ch-1)/2))];$('power').textContent=Math.floor(s.atk*4+s.hp*.4+s.def*3);$('chapterCount').textContent='第 '+ch+' / 30 章';$('weaponSlot').textContent=meta(save.items.find(x=>x.id===save.eq.weapon)).name;$('petSlot').textContent=meta(save.items.find(x=>x.id===save.eq.pet)).name;$('artifactSlot').textContent=meta(save.items.find(x=>x.id===save.eq.artifact)).name;for(const k of ['atk','hp','def'])$(k+'Lv').textContent='Lv.'+save.talents[k];const need=(save.realm+1)*5,total=save.talents.atk+save.talents.hp+save.talents.def;$('breakBtn').style.display=total>=need&&save.realm<14?'block':'none';const mins=Math.floor((Date.now()-save.last)/60000);$('afk').textContent=mins?('可領取 '+mins*15+' 靈石'):'聚靈中';}
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('nav').style.display=v==='battle'?'none':'grid';if(v==='gear')renderGear();if(v==='gacha')renderPools()}
function chapter(d){save.chapter=Math.max(1,Math.min(save.maxChapter,save.chapter+d));persist();refresh()}
function claimAfk(){const mins=Math.max(1,Math.floor((Date.now()-save.last)/60000)),s=Math.min(2000,mins*15+save.maxChapter*20),g=Math.min(300,Math.floor(mins/2)*10+30);save.stone+=s;save.gem+=g;save.last=Date.now();persist();refresh();modal('聚靈陣收穫','下品靈石 +'+s+'<br>極品靈石 +'+g)}
function upgrade(k){const cost=save.talents[k]*50;if(save.stone<cost)return modal('靈石不足','請出關歷練或領取聚靈陣收益。');save.stone-=cost;save.talents[k]++;persist();refresh()}
function breakthrough(){if(save.realm<14){save.realm++;persist();refresh();modal('渡劫成功','境界提升至 '+realms[save.realm]+'！')}}
function renderGear(){const cat=$('filter').value;$('inventory').innerHTML=save.items.filter(x=>x.cat===cat).sort((a,b)=>b.tier-a.tier).map(it=>{const m=meta(it),eq=save.eq[cat]===it.id;return '<div class="item"><b class="gold">'+quality[it.tier]+'·'+m.name+'</b><small>'+m.build+' · '+m.desc+'</small><div class="row"><span class="muted">屬性 +'+m.value+'</span><button onclick="equip('+it.id+')">'+(eq?'已裝備':'裝備')+'</button></div></div>'}).join('')||'尚無裝備'}
function equip(id){const it=save.items.find(x=>x.id===id);save.eq[it.cat]=id;persist();refresh();renderGear()}
function mergeItems(){let n=0,again=true;while(again){again=false;for(const a of [...save.items]){if(a.tier>=5)continue;const same=save.items.filter(x=>x.cat===a.cat&&x.key===a.key&&x.tier===a.tier);if(same.length>=3){const ids=same.slice(0,3).map(x=>x.id),was=ids.includes(save.eq[a.cat]);save.items=save.items.filter(x=>!ids.includes(x.id));const id=save.next++;save.items.push({id,cat:a.cat,key:a.key,tier:a.tier+1});if(was)save.eq[a.cat]=id;n++;again=true;break}}}persist();refresh();renderGear();modal('三合一煉化',n?'成功合成 '+n+' 件高階裝備！':'目前沒有三件相同的同階裝備。')}
function renderPools(){$('pools').innerHTML=[['weapon','古修洞府寶箱','飛劍、雷錘、重尺'],['pet','萬靈真經靈獸蛋','噬金蟲、啼魂獸、銀月狼'],['artifact','虛天殿秘寶閣','掌天瓶、風雷翅、虛天鼎']].map(([c,n,d])=>'<div class="item"><b>'+n+'</b><small>'+d+'</small><div class="actions"><button onclick="pull(\''+c+'\',1)">單抽 100</button><button onclick="pull(\''+c+'\',10)">十連 900</button></div></div>').join('')}
function pull(cat,num){const cost=num===10?900:100;if(save.gem<cost)return modal('極品靈石不足','目前靈石不足，先去歷練或領取聚靈陣收益。');save.gem-=cost;const got=[];for(let i=0;i<num;i++){const t=templates[cat][Math.floor(Math.random()*3)],r=Math.random(),tier=r<.08?2:r<.35?1:0;save.items.push({id:save.next++,cat,key:t[0],tier});got.push(quality[tier]+'·'+t[1])}persist();refresh();modal('秘境尋寶收穫',got.join('<br>'))}
const skillPool=[['combo','青元劍芒','連擊率提升 20%'],['sword','劍氣縱橫','每次普攻追加飛劍傷害'],['thunder','辟邪神雷訣','普攻有機率觸發雷擊'],['heal','大衍吸靈術','普攻回復部分生命'],['shield','玄鐵護體功','戰鬥開始獲得護盾'],['crit','劍心通明','暴擊率提升 20%'],['rage','天魔解體大法','大招靈力累積加快'],['thorn','託天魔甲','受擊時反彈傷害']];
function startRun(){const s=stats(),w=meta(save.items.find(x=>x.id===save.eq.weapon)),p=meta(save.items.find(x=>x.id===save.eq.pet)),a=meta(save.items.find(x=>x.id===save.eq.artifact));run={day:1,hp:s.hp,max:s.hp,atk:s.atk,def:s.def,crit:s.crit,stone:0,exp:0,next:35,skills:[],w:w.key,p:p.key,a:a.key,enemy:null,turn:0,shield:0,paused:false,build:w.build,chapter:save.chapter};speed=1;$('runChapter').textContent='第'+save.chapter+'章：'+titles[save.chapter-1];$('build').textContent=w.build;$('enemyArt').textContent='🌲🐍';$('battleLog').textContent='踏入歷練之地，開始60天自動修行！';showView('battle');tick()}
function log(t){$('battleLog').textContent=t}
function tick(){if(!run||run.paused)return;if(run.day>60){finish(true);return}if(!run.enemy){if([15,30,45].includes(run.day))spawn('菁英妖王',1.8,false);else if(run.day===60)spawn('章節首領',2.6,true);else{const r=Math.random();if(r<.5)spawn('山林毒蟒',1,false);else if(r<.78){run.paused=true;modalChoices('修仙奇遇',[['搜尋儲物袋','獲得靈石 +35 與修為',()=>{closeModal();run.stone+=35;gainExp(30);nextDay()}],['煉化殘留靈氣','回血並永久提升攻擊',()=>{closeModal();run.hp=Math.min(run.max,run.hp+run.max*.3);run.atk=Math.floor(run.atk*1.1);nextDay()}]])}else{run.hp=Math.min(run.max,run.hp+run.max*.15);run.stone+=12;log('第'+run.day+'天：打坐調息，靈石 +12。');nextDay()}}}else fight();updateBattle();if(run&&!run.paused)timer=setTimeout(tick,run.enemy?500/speed:1000/speed)}
function spawn(name,mult,boss){const c=run.chapter,scale=Math.pow(1.24,c-1),hp=Math.floor((85+run.day*8)*scale*mult);run.enemy={name,hp,max:hp,atk:Math.floor((12+run.day*.9)*scale*mult),def:Math.floor((3+run.day*.25)*scale*mult),boss,stun:false};run.shield=run.skills.some(x=>x[0]==='shield')?run.max*.4:0;log('第'+run.day+'天：遭遇 '+name+'，自動開戰！')}
function fight(){const e=run.enemy;if(!e)return;run.turn++;let hits=Math.random()<((run.w==='sword'?.3:.1)+(has('combo')?.2:0))?2:1;for(let i=0;i<hits;i++){let dmg=Math.max(1,run.atk-e.def),crit=Math.random()*100<run.crit+(has('crit')?20:0);if(crit)dmg=Math.floor(dmg*1.8);e.hp-=dmg;if(run.w==='sword'||has('sword'))e.hp-=Math.floor(run.atk*.65);if((run.w==='hammer'||has('thunder'))&&Math.random()<.35)e.hp-=Math.floor(run.atk*1.3);if(run.w==='ruler')run.shield+=Math.floor(run.def*1.2);if(has('heal'))run.hp=Math.min(run.max,run.hp+Math.floor(dmg*.2));run.rage=(run.rage||0)+(has('rage')?50:28)}if(run.p==='beetle'){e.hp-=Math.floor(run.atk*.45);e.def=Math.max(0,e.def-2)}else if(run.p==='ghost'&&run.turn%3===0)e.stun=true;if(run.rage>=100){run.rage=0;if(run.a==='bottle'){run.hp=Math.min(run.max,run.hp+run.max*.35);run.atk=Math.floor(run.atk*1.08)}else e.hp-=Math.floor(run.atk*(run.a==='wings'?1.8:2.4))}if(e.hp<=0){winFight();return}if(e.stun){e.stun=false;return}let hurt=Math.max(1,e.atk-run.def),abs=Math.min(run.shield,hurt);run.shield-=abs;run.hp-=hurt-abs;if(run.w==='ruler'||has('thorn'))e.hp-=Math.floor(run.atk*.9+run.def);if(run.hp<=0){finish(false);return}if(e.hp<=0)winFight()}
function has(id){return run.skills.some(x=>x[0]===id)}
function winFight(){const e=run.enemy;run.stone+=Math.floor((15+run.day*2)*(e.boss?3:1));log('擊敗 '+e.name+'，靈石增加！');run.enemy=null;if(e.boss){finish(true);return}run.day++;gainExp(26)}
function nextDay(){run.day++;run.paused=false;updateBattle();tick()}
function gainExp(n){run.exp+=n;if(run.exp>=run.next){run.exp-=run.next;run.next=Math.floor(run.next*1.28);run.paused=true;const picks=[...skillPool].sort(()=>Math.random()-.5).slice(0,3);modalChoices('修為精進！選擇一門功法',picks.map(s=>[s[1],s[2],()=>{run.skills.push(s);$('skillCount').textContent=run.skills.length;log('領悟功法：'+s[1]);run.paused=false;closeModal();tick()}]))}}
function updateBattle(){if(!run)return;$('day').textContent=run.day;$('runStone').textContent=run.stone;$('skillCount').textContent=run.skills.length;$('playerHpText').textContent=Math.max(0,Math.floor(run.hp))+' / '+run.max;$('playerHp').style.width=Math.max(0,run.hp/run.max*100)+'%';$('enemyName').textContent=run.enemy?run.enemy.name:'等待下一場遭遇';$('enemyHpText').textContent=run.enemy?Math.max(0,Math.floor(run.enemy.hp))+' / '+run.enemy.max:'--';$('enemyHp').style.width=run.enemy?Math.max(0,run.enemy.hp/run.enemy.max*100)+'%':'0%'}
function toggleSpeed(){speed=speed===1?2:1;$('speedBtn').textContent='倍速 '+speed+'x'}
function pauseRun(){if(!run)return;run.paused=!run.paused;$('pauseBtn').textContent=run.paused?'繼續':'暫停';if(!run.paused)tick();else clearTimeout(timer)}
function retreat(){if(!run)return;clearTimeout(timer);save.stone+=run.stone;persist();run=null;refresh();showView('home')}
function finish(win){clearTimeout(timer);const r=run,bonus=win?150+r.chapter*20:30;save.stone+=r.stone;save.gem+=bonus;if(win&&r.chapter===save.maxChapter&&save.maxChapter<30){save.maxChapter++;save.chapter=save.maxChapter}run=null;persist();refresh();showView('home');modal(win?'章節通關！':'道心受損，返回洞府','歷練靈石 +'+r.stone+'<br>極品靈石 +'+bonus)}
function showSkills(){if(!run)return;modal('已領悟功法',run.skills.map(x=>x[1]+'：'+x[2]).join('<br>')||'尚未領悟局內功法')}
function modal(t,b){$('modalTitle').textContent=t;$('modalBody').innerHTML='<p>'+b+'</p>';$('modal').classList.add('show')}
function modalChoices(t,choices){$('modalTitle').textContent=t;$('modalBody').innerHTML='';choices.forEach(c=>{const b=document.createElement('button');b.className='choice';b.innerHTML='<b>'+c[0]+'</b><br><small>'+c[1]+'</small>';b.onclick=c[2];$('modalBody').appendChild(b)});$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
refresh();renderPools();
</script>
</body>
</html>
