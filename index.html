<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10151d">
<title>凡人仙途：無盡秘境</title>
<style>
:root{color-scheme:dark;--bg:#0c1119;--line:#2c3c50;--gold:#e9c477;--jade:#69c9a0;--text:#edf2f7;--muted:#91a0b3}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}button{font:inherit;color:inherit;cursor:pointer}#app{height:100dvh;display:flex;flex-direction:column;background:#0c1119}
header{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #263344;background:#101722;z-index:3}header .brand{font-weight:800;letter-spacing:.04em;font-size:15px}header .realm{font-size:12px;color:var(--gold);padding:6px 9px;border:1px solid #665638;border-radius:20px}
#battle{position:relative;flex:1;min-height:0;overflow:hidden;background:#111b20}canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:12px;right:12px;top:10px;pointer-events:none;display:flex;justify-content:space-between;gap:10px}.hudbox{background:#0b121bd9;border:1px solid #334253;border-radius:12px;padding:8px 10px;backdrop-filter:blur(8px);min-width:112px;box-shadow:0 5px 18px #0005}
.small{font-size:11px;color:var(--muted)}.value{font-weight:800;font-size:14px}.bar{height:6px;background:#293544;border-radius:8px;overflow:hidden;margin-top:5px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#4ba77f,#91d5a5);width:0%}
#feed{position:absolute;left:12px;bottom:12px;max-width:68%;font-size:11px;color:#dce6ee;background:#0b121bb8;padding:7px 9px;border-radius:9px;pointer-events:none}#bossbar{position:absolute;top:78px;left:16%;right:16%;display:none;text-align:center;font-size:11px;color:#f0c8a0;pointer-events:none}#bossbar .bar>i{background:linear-gradient(90deg,#a94f58,#e69c74)}#pausehint{position:absolute;right:12px;bottom:12px;font-size:10px;color:#d0d8df;background:#0b121bb8;padding:6px 8px;border-radius:8px;pointer-events:none}
nav{height:66px;flex:none;display:grid;grid-template-columns:repeat(3,1fr);padding:5px 10px calc(5px + env(safe-area-inset-bottom));background:#111a26;border-top:1px solid #2a394b;z-index:5}nav button{background:transparent;border:0;color:#9baabc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}nav button b{font-size:20px;font-weight:500}nav button.active{color:var(--gold)}
#panel{position:absolute;inset:0;background:#0c121bf2;z-index:4;display:none;overflow:auto;padding:16px 14px 24px}#panel.open{display:block}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.panelhead h2{font-size:20px;margin:0}.close{background:#263548;border:1px solid #41536a;border-radius:9px;padding:7px 12px;font-size:12px}
.card{background:linear-gradient(145deg,#192534,#121b27);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted)}.tag{font-size:10px;border:1px solid #46566b;border-radius:20px;padding:3px 7px;color:#b9c7d6}.btn{background:#344b60;border:1px solid #56708a;padding:8px 11px;border-radius:9px;font-size:12px}.btn:disabled{opacity:.4}.item{background:#1a2736;border:1px solid #35475c;border-radius:10px;padding:10px;margin:6px 0}.item h3{font-size:13px;margin:0 0 5px}.item p{font-size:11px;color:#aebccc;margin:0 0 8px;line-height:1.5}.common{color:#d5dce4}.rare{color:#78b8ee}.epic{color:#c19aff}.legend{color:#f0c66e}.stat{font-size:12px;color:#b8c5d3;line-height:1.8}.note{font-size:10px;color:#78899d;text-align:center;padding:12px}
@media(min-width:700px){#app{max-width:760px;margin:auto;border-left:1px solid #273548;border-right:1px solid #273548}header{height:60px}nav{height:72px}}

/* Art overhaul: refined xianxia visual language and mobile HUD hierarchy. */
header{background:linear-gradient(180deg,#172333 0%,#101925 100%);border-bottom:1px solid #7e6940;box-shadow:0 5px 18px #02070b80}
header .brand{font-size:16px;letter-spacing:.08em;text-shadow:0 1px 8px #d8b86a33}
header .realm{background:linear-gradient(135deg,#352d20,#171d24);border-color:#947644;box-shadow:inset 0 0 0 1px #e7c77b22,0 2px 10px #0006;font-weight:700}
.hud{top:12px;left:12px;right:12px;gap:8px}
.hudbox{min-width:124px;padding:10px 12px;background:linear-gradient(145deg,#111d29ee,#09131deF);border:1px solid #9a8356;border-radius:13px;box-shadow:0 8px 24px #0008,inset 0 1px #ffffff12}
.hudbox:after{content:"";display:block;height:1px;margin-top:7px;background:linear-gradient(90deg,transparent,#d4b97866,transparent)}
.small{font-size:11px;letter-spacing:.035em;color:#aebdca}
.value{font-size:16px;letter-spacing:.02em;text-shadow:0 1px 8px #d8c18b33}
.bar{height:7px;background:#263543;border:1px solid #52604f;border-radius:20px;margin-top:7px}
.bar>i{background:linear-gradient(90deg,#397d68,#76cba0,#d4df9c);box-shadow:0 0 9px #79d6a455}
#feed,#pausehint{background:linear-gradient(135deg,#101c27eF,#0a121beF);border:1px solid #5f654f88;box-shadow:0 5px 16px #0006;border-radius:11px;padding:9px 11px;font-size:11px}
#feed{color:#e4d6ad}
#pausehint{color:#c6d4dd}
nav{background:linear-gradient(180deg,#172333,#0e1722);border-top:1px solid #806d49;box-shadow:0 -5px 22px #0007}
nav button{font-size:11px;letter-spacing:.08em}
nav button b{font-size:22px;text-shadow:0 2px 10px #d7bd7a22}
nav button.active{color:#f0d18d;text-shadow:0 0 12px #d8b86a66}
#panel{background:linear-gradient(160deg,#111d2aF7,#090f18F8);backdrop-filter:blur(14px)}
.panelhead h2{color:#f0d18d;letter-spacing:.08em}
.card{background:linear-gradient(145deg,#1e3040,#111d2a);border-color:#7a6948;box-shadow:0 7px 20px #0004,inset 0 1px #ffffff0d}
.item{background:linear-gradient(145deg,#1c2b39,#111b27);border-color:#52634f}
.btn,.close{background:linear-gradient(135deg,#53674f,#263c3a);border-color:#a08b5a;color:#f4e6bf}

</style>
</head>
<body><div id="app">
<header><div class="brand">凡人仙途 <span style="color:var(--gold)">· 無盡秘境</span></div><div class="realm" id="realmBadge">練氣期・一層</div></header>
<main id="battle"><div id="world" aria-label="遊戲戰鬥畫面"></div>
<div class="hud"><div class="hudbox"><div class="small">修士生命</div><div class="value" id="hpText">100 / 100</div><div class="bar"><i id="hpBar"></i></div><div class="small" style="margin-top:5px" id="levelText">Lv. 1 · 0 EXP</div></div>
<div class="hudbox" style="text-align:right"><div class="small" id="mapName">凡人山林・秘境</div><div class="value" id="killText">擊殺 0</div><div class="small" id="effText">效率計算中</div></div></div>
<div id="bossbar"><div id="bossname">秘境首領</div><div class="bar"><i id="bossHp"></i></div></div><div id="feed">靈氣流轉，正在自動探索秘境……</div><div id="pausehint">自動戰鬥 · 自動施法</div><div id="panel"></div></main>
<nav><button data-tab="bag"><b>▣</b>背包</button><button data-tab="talent"><b>✧</b>天賦</button><button data-tab="skill"><b>❖</b>技能</button></nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.10.1/dist/pixi.min.js"></script>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id),world=$("world");
const realms=[
{name:"練氣期",start:1,end:13,area:"凡人山林",exp:9,hp:34,atk:4,spawn:1.05},
{name:"築基期",start:14,end:22,area:"靈脈山谷",exp:27,hp:105,atk:9,spawn:.95},
{name:"金丹期",start:23,end:31,area:"妖獸秘境",exp:72,hp:300,atk:20,spawn:.9},
{name:"元嬰期",start:32,end:40,area:"上古遺跡",exp:150,hp:820,atk:42,spawn:.86},
{name:"化神期",start:41,end:49,area:"天外仙域",exp:290,hp:2100,atk:82,spawn:.82},
{name:"煉虛期",start:50,end:58,area:"虛空秘境",exp:520,hp:5100,atk:155,spawn:.78},
{name:"合體期",start:59,end:67,area:"古仙戰場",exp:850,hp:11500,atk:270,spawn:.74},
{name:"大乘期",start:68,end:76,area:"仙門遺址",exp:1350,hp:24500,atk:440,spawn:.7},
{name:"渡劫期",start:77,end:100,area:"天劫之地",exp:2100,hp:52000,atk:700,spawn:.66}
];
const state={level:1,xp:0,xpNeed:90,hp:100,maxHp:100,atk:12,def:2,attackSpeed:1,castSpeed:1,moveSpeed:1,crit:5,lifeSteal:0,skills:["劍氣斬"],talents:[],inventory:[],kills:0,totalXp:0,lastStat:Date.now(),recentKills:0,expPerHour:0,activeTab:null,spawnAt:0,attackAt:0,skillTimers:{},player:{x:0,y:0,angle:0,moving:false,anim:0,swing:0},enemies:[],effects:[],projectiles:[],boss:null};
const skillDefs=[
{name:"劍氣斬",desc:"每 2.4 秒自動斬出劍氣，造成 180% 攻擊傷害。",cd:2.4},
{name:"雷球術",desc:"每 6 秒自動釋放雷球，最多連鎖 4 個敵人。",cd:6},
{name:"護體靈盾",desc:"生命低於 45% 時自動恢復 18% 最大生命，冷卻 18 秒。",cd:18},
{name:"吸靈訣",desc:"擊殺敵人時額外恢復生命。",cd:0},
{name:"飛劍追擊",desc:"每 3.8 秒追加飛劍攻擊。",cd:3.8},
{name:"雷身共鳴",desc:"雷系傷害提高，雷擊有機率再次觸發。",cd:0}
];
const talentDefs=[
{name:"淬體",desc:"最大生命 +12%。",apply:s=>s.maxHp*=1.12},
{name:"御劍",desc:"攻擊速度 +10%。",apply:s=>s.attackSpeed*=1.1},
{name:"靈脈",desc:"施法速度 +12%。",apply:s=>s.castSpeed*=1.12},
{name:"疾行",desc:"移動速度 +12%。",apply:s=>s.moveSpeed*=1.12},
{name:"洞察",desc:"暴擊率 +5%。",apply:s=>s.crit+=5},
{name:"貪狼",desc:"擊殺恢復 2% 最大生命。",apply:s=>s.lifeSteal+=.02}
];
const gearPool=[
{name:"青鋒短劍",slot:"weapon",rarity:"common",desc:"攻擊力 +5",atk:5},
{name:"靈木法杖",slot:"weapon",rarity:"rare",desc:"攻擊力 +8、施法速度 +8%",atk:8,cast:1.08},
{name:"雷紋劍胚",slot:"weapon",rarity:"epic",desc:"攻擊力 +12，攻擊命中有機率追加雷擊。",atk:12,proc:"雷擊"},
{name:"玄鐵護腕",slot:"head",rarity:"common",desc:"防禦 +3、生命 +15",def:3,hp:15},
{name:"青藤靈衣",slot:"body",rarity:"rare",desc:"防禦 +5、生命 +35",def:5,hp:35},
{name:"噬靈戒",slot:"ring",rarity:"epic",desc:"攻擊力 +4，擊殺恢復生命。",atk:4,life:.03},
{name:"分光劍匣",slot:"weapon",rarity:"legend",desc:"攻擊力 +18，劍氣可追加飛劍。",atk:18,proc:"分光"},
{name:"雷紋護符",slot:"ring",rarity:"legend",desc:"攻擊力 +9，雷擊可額外連鎖。",atk:9,proc:"雷鏈"}
];
let W=0,H=0,last=0,app=null,worldLayer=null,spriteLayer=null,glowLayer=null,fxLayer=null,artTextures={},spriteNodes=new Map(),playerSprite=null,playerBaseScaleX=1,playerBaseScaleY=1;
const particlePool=[];const floatingTexts=[];
class ParticleEmitter{
 constructor(){this.items=[]}
 emit(x,y,color,count=8,power=70){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,v=power*(.25+Math.random()*.75);this.items.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.35,max:.7,color,size:1.5+Math.random()*3})}}
 update(dt){this.items=this.items.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;return p.life>0})}
 draw(g){for(const p of this.items){g.circle(p.x,p.y,p.size*Math.max(.2,p.life/p.max)).fill({color:p.color,alpha:Math.min(1,p.life/p.max)})}}
}
const particles=new ParticleEmitter();
async function setupRenderer(){
 if(!window.PIXI){feed("渲染引擎載入失敗，請確認網路連線後重新整理。");return false}
 app=new PIXI.Application();
 await app.init({resizeTo:world,background:"#17231f",antialias:true,resolution:Math.min(window.devicePixelRatio||1,2),autoDensity:true,powerPreference:"high-performance",autoStart:false,sharedTicker:false});
 world.replaceChildren(app.canvas);app.canvas.style.width="100%";app.canvas.style.height="100%";app.canvas.style.display="block";
 worldLayer=new PIXI.Graphics();spriteLayer=new PIXI.Container();glowLayer=new PIXI.Graphics();fxLayer=new PIXI.Graphics();
 app.stage.addChild(worldLayer,spriteLayer,glowLayer,fxLayer);
 try{glowLayer.filters=[new PIXI.BlurFilter({strength:4,quality:2})];glowLayer.blendMode="add"}catch(e){console.warn("Glow filter fallback",e)}
 const art={player:"assets/player-cultivator.svg",wolf:"assets/wolf-spirit.svg",golem:"assets/stone-golem.svg",wraith:"assets/wraith-spirit.svg"};
 for(const [key,path] of Object.entries(art)){artTextures[key]=await PIXI.Assets.load(path)}
 playerSprite=new PIXI.Sprite(artTextures.player);playerSprite.anchor.set(.5,.62);playerSprite.width=42;playerSprite.height=48;playerBaseScaleX=playerSprite.scale.x;playerBaseScaleY=playerSprite.scale.y;spriteLayer.addChild(playerSprite);
 try{glowLayer.filters=[new PIXI.BlurFilter({strength:4,quality:2})];glowLayer.blendMode="add"}catch(e){console.warn("Glow filter fallback",e)}
 resize();return true
}
function resize(){if(!world)return;const r=world.getBoundingClientRect();W=r.width;H=r.height;if(!state.player.x){state.player.x=W/2;state.player.y=H/2}}
window.addEventListener("resize",resize);
function realmIndex(l=state.level){return Math.max(0,realms.findIndex(r=>l>=r.start&&l<=r.end))}
function realm(){return realms[realmIndex()]}
function realmStage(){const i=realmIndex(),r=realms[i],n=state.level-r.start+1;if(i===0)return "練氣"+["一","二","三","四","五","六","七","八","九","十","十一","十二","十三"][n-1]+"層";return ["初期","中期","後期","圓滿"][Math.min(3,Math.floor((n-1)/Math.max(1,Math.ceil((r.end-r.start+1)/4))))]}
function feed(t){$("feed").textContent=t}
function recalc(){let s={maxHp:100+Math.max(0,state.level-1)*8,atk:12+Math.max(0,state.level-1)*1.5,def:2,attackSpeed:1,castSpeed:1,moveSpeed:1,crit:5,lifeSteal:0};state.inventory.filter(g=>g.equipped).forEach(g=>{s.atk+=g.atk||0;s.def+=g.def||0;s.maxHp+=g.hp||0;s.castSpeed*=g.cast||1;s.lifeSteal+=g.life||0});state.talents.forEach(i=>talentDefs[i]?.apply(s));state.maxHp=s.maxHp;state.atk=s.atk;state.def=s.def;state.attackSpeed=s.attackSpeed;state.castSpeed=s.castSpeed;state.moveSpeed=s.moveSpeed;state.crit=s.crit;state.lifeSteal=s.lifeSteal;state.hp=Math.min(state.hp,state.maxHp)}
function xpNeed(level){return Math.round(90*Math.pow(1.105,level-1)*(level<14?1:level<23?1.15:level<32?1.25:1.4))}
function updateHud(){const r=realm();$("realmBadge").textContent=r.name+"・"+realmStage();$("mapName").textContent=r.area+"・秘境";$("hpText").textContent=Math.max(0,Math.ceil(state.hp))+" / "+Math.ceil(state.maxHp);$("hpBar").style.width=Math.max(0,state.hp/state.maxHp*100)+"%";$("levelText").textContent="Lv. "+state.level+" · "+Math.floor(state.xp)+" / "+state.xpNeed+" EXP";$("killText").textContent="擊殺 "+state.kills;$("effText").textContent=Math.round(state.expPerHour).toLocaleString()+" EXP／時"}
function levelUp(){while(state.xp>=state.xpNeed&&state.level<100){state.xp-=state.xpNeed;state.level++;state.xpNeed=xpNeed(state.level);recalc();state.hp=Math.min(state.maxHp,state.hp+20);if([13,22,31,40,49,58,67,76].includes(state.level-1))feed("修為抵達境界瓶頸！此版本先展示境界進度，突破試煉待後續開發。");else feed("修為精進！突破至 "+state.level+" 等。")}if(state.level>=100)state.xp=0;recalc();updateHud()}
function addXp(n){if(state.level>=100)return;state.xp+=n;state.totalXp+=n;levelUp()}
function dropGear(){const g={...gearPool[Math.floor(Math.random()*gearPool.length)],id:Math.random().toString(36).slice(2),equipped:false};state.inventory.unshift(g);if(state.inventory.length>80)state.inventory.pop();feed("獲得 "+g.name+"！");if(state.activeTab==="bag")renderPanel()}
function equip(g){state.inventory.forEach(x=>{if(x.slot===g.slot)x.equipped=false});g.equipped=true;recalc();feed("已裝備："+g.name);renderPanel();updateHud()}
function spawnEnemy(){const r=realm(),a=Math.random()*Math.PI*2,d=Math.max(W,H)*(.48+Math.random()*.18),boss=state.kills>0&&state.kills%80===0&&!state.boss,m=1+realmIndex()*.48,e={x:Math.max(15,Math.min(W-15,state.player.x+Math.cos(a)*d)),y:Math.max(85,Math.min(H-30,state.player.y+Math.sin(a)*d)),hp:r.hp*m*(boss?12:1),max:r.hp*m*(boss?12:1),atk:r.atk*m,boss,type:boss?"golem":["wolf","golem","wraith"][Math.floor(Math.random()*3)],hit:0};if(boss){state.boss=e;$("bossbar").style.display="block";$("bossname").textContent="秘境首領・山魈王"}state.enemies.push(e)}
function nearest(){let best=null,bd=Infinity;for(const e of state.enemies){const d=Math.hypot(e.x-state.player.x,e.y-state.player.y);if(d<bd){bd=d;best=e}}return best}
function damage(e,n,color="#f4d18a"){if(!state.enemies.includes(e))return;e.hp-=n;e.hit=.15;particles.emit(e.x,e.y,color,7,85);state.effects.push({x:e.x,y:e.y-12,text:"-"+Math.round(n),life:.7,color});if(app){const label=new PIXI.Text({text:"-"+Math.round(n),style:{fontFamily:"Arial",fontSize:13,fontWeight:"bold",fill:color,stroke:{color:"#10151d",width:3}}});label.anchor.set(.5);label.x=e.x;label.y=e.y-18;app.stage.addChild(label);floatingTexts.push({node:label,life:.72,max:.72})}if(e.hp<=0)kill(e)}
function kill(e){const idx=state.enemies.indexOf(e);if(idx<0)return;particles.emit(e.x,e.y,e.type==="wraith"?"#9deaff":e.type==="golem"?"#d5b47a":"#b7d89b",22,145);state.effects.push({x:e.x,y:e.y,text:"",life:.42,color:e.type==="wraith"?"#9deaff":"#d7c28d",ring:true});state.enemies.splice(idx,1);if(e.boss){state.boss=null;$("bossbar").style.display="none";feed("擊敗秘境首領！獲得額外獎勵。");dropGear();dropGear()}state.kills++;state.recentKills++;addXp(realm().exp*(e.boss?15:1));if(Math.random()<.12||e.boss)dropGear();if(state.lifeSteal>0)state.hp=Math.min(state.maxHp,state.hp+state.maxHp*state.lifeSteal);if(state.skills.includes("吸靈訣"))state.hp=Math.min(state.maxHp,state.hp+2)}
function playerAttack(t){state.player.swing=.32;state.player.attackPulse=.32;particles.emit(state.player.x,state.player.y,"#a9d8ff",14,125);state.effects.push({x:state.player.x,y:state.player.y-12,life:.34,max:.34,color:"#d8f4ff",slash:true,angle:state.player.angle});const d=state.atk*(Math.random()*100<state.crit?2:1);damage(t,d);state.effects.push({x:(state.player.x+t.x)/2,y:(state.player.y+t.y)/2,text:"✦",life:.22,color:"#a9d8ff"});if(state.inventory.some(g=>g.equipped&&g.proc==="雷擊")&&Math.random()<.22)damage(t,state.atk*.8,"#8fdcff");if(state.inventory.some(g=>g.equipped&&g.proc==="分光")){const other=state.enemies.find(e=>e!==t&&Math.hypot(e.x-t.x,e.y-t.y)<120);if(other)damage(other,state.atk*.55,"#a9d8ff")}}
function visualProjectile(target,color="#a9d8ff",speed=430,size=5){if(!target)return;state.projectiles.push({x:state.player.x,y:state.player.y,target,color,speed,size,life:1.8})}
function castSkills(t,now){if(!t)return;const active=(name,cd,fn)=>{if(state.skills.includes(name)&&now-(state.skillTimers[name]||0)>cd*1000/state.castSpeed){state.skillTimers[name]=now;fn()}};active("劍氣斬",2.4,()=>{visualProjectile(t,"#a9d8ff",520,7);damage(t,state.atk*1.8,"#a9d8ff");state.effects.push({x:t.x,y:t.y,text:"劍氣",life:.5,color:"#b7e2ff"})});active("雷球術",6,()=>{state.enemies.slice(0,4).forEach((e,i)=>{visualProjectile(e,"#a78bfa",620,6);damage(e,state.atk*1.25*(1-i*.12),"#8fdcff")});feed("雷球術引發連鎖雷擊！")});active("飛劍追擊",3.8,()=>{visualProjectile(t,"#d9eaff",700,4);damage(t,state.atk*1.1,"#b7e2ff")});active("護體靈盾",18,()=>{if(state.hp<state.maxHp*.45){state.hp=Math.min(state.maxHp,state.hp+state.maxHp*.18);feed("護體靈盾自動恢復氣血。")}else state.skillTimers["護體靈盾"]=now-17000})}
function step(dt,now){const p=state.player,t=nearest();
 state.player.swing=Math.max(0,state.player.swing-dt);state.player.attackPulse=Math.max(0,(state.player.attackPulse||0)-dt);state.projectiles=state.projectiles.filter(q=>{q.life-=dt;if(!state.enemies.includes(q.target))return false;const dx=q.target.x-q.x,dy=q.target.y-q.y,d=Math.hypot(dx,dy)||1,move=Math.min(d,q.speed*dt);q.x+=dx/d*move;q.y+=dy/d*move;return q.life>0&&d>7});
 for(const f of floatingTexts){f.life-=dt;f.node.y-=dt*24;f.node.alpha=Math.max(0,f.life/f.max)}for(let i=floatingTexts.length-1;i>=0;i--)if(floatingTexts[i].life<=0){app?.stage.removeChild(floatingTexts[i].node);floatingTexts[i].node.destroy();floatingTexts.splice(i,1)}if(!state.boss&&state.enemies.length<12&&now-state.spawnAt>realm().spawn*1000){spawnEnemy();state.spawnAt=now}if(t){const dx=t.x-p.x,dy=t.y-p.y,d=Math.hypot(dx,dy)||1;p.angle=Math.atan2(dy,dx);p.moving=d>42;if(d>42){p.anim+=dt*11;p.x+=dx/d*state.moveSpeed*55*dt;p.y+=dy/d*state.moveSpeed*55*dt;p.x=Math.max(12,Math.min(W-12,p.x));p.y=Math.max(80,Math.min(H-12,p.y))}else if(now-state.attackAt>720/state.attackSpeed){state.attackAt=now;playerAttack(t)}castSkills(t,now)}for(const e of [...state.enemies]){const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;if(d>35){e.anim=(e.anim||0)+dt*8;e.facing=dx<0?-1:1;e.x+=dx/d*18*dt;e.y+=dy/d*18*dt;e.attackTell=0}else{e.attackTell=(e.attackTell||0)+dt;if(e.attackTell>.82&&now-(e.lastHit||0)>1200){e.attackTell=0;e.lastHit=now;state.hp-=Math.max(1,e.atk-state.def);state.effects.push({x:p.x,y:p.y-18,text:"受擊",life:.5,color:"#ff9999",max:.5});if(state.hp<=0){state.hp=state.maxHp*.55;state.enemies=[];feed("修士重傷，靈力護持後撤回秘境入口。")}}}if(e.boss)$("bossHp").style.width=Math.max(0,e.hp/e.max*100)+"%"}state.effects=state.effects.filter(f=>{f.life-=dt;return f.life>0});state.enemies.forEach(e=>e.hit=Math.max(0,e.hit-dt));if(now-state.lastStat>5000){state.expPerHour=state.recentKills*realm().exp*720;state.recentKills=0;state.lastStat=now;updateHud()}}
function draw(dt=0){
 if(!app||!worldLayer)return;
 const g=worldLayer,gl=glowLayer,fx=fxLayer;g.clear();gl.clear();fx.clear();
 g.rect(0,0,W,H).fill("#17251f");
 // Quiet, walkable forest clearing: reduce repeated blobs and preserve readable combat space.
 // Subtle moss variation, deliberately small and low contrast.
 for(let i=0;i<26;i++){const x=(i*197+47)%Math.max(1,W),y=(i*263+31)%Math.max(1,H),r=7+(i%4)*3;g.ellipse(x,y,r*1.7,r*.62).fill({color:i%2?"#344b36":"#2b4433",alpha:.12});}
 // Natural forest boundary made from irregular canopy silhouettes, not stacks of circles.
 for(let i=0;i<6;i++){const side=i%2,x=side?W+5:-5,y=(i*181+75)%Math.max(1,H),s=0.78+(i%3)*.13;
  g.ellipse(x+(side?-9:9),y+24,27*s,8*s).fill({color:"#07110e",alpha:.42});
  g.roundRect(x-5*s,y-2*s,10*s,31*s,4).fill({color:"#554733",alpha:.82});
  const ox=side?-1:1;
  g.moveTo(x-27*s,y+4*s).lineTo(x-24*s,y-17*s).lineTo(x-12*s,y-26*s).lineTo(x-4*s,y-42*s).lineTo(x+10*s,y-34*s).lineTo(x+25*s,y-19*s).lineTo(x+29*s,y+1*s).lineTo(x+17*s,y+18*s).lineTo(x-12*s,y+20*s).closePath().fill({color:"#1c3929",alpha:.98});
  g.moveTo(x-18*s,y-7*s).lineTo(x-13*s,y-24*s).lineTo(x-2*s,y-33*s).lineTo(x+8*s,y-26*s).lineTo(x+19*s,y-12*s).lineTo(x+15*s,y+4*s).lineTo(x-5*s,y+10*s).closePath().fill({color:"#31563a",alpha:.9});
  g.moveTo(x-8*s,y-18*s).lineTo(x-1*s,y-30*s).lineTo(x+10*s,y-21*s).lineTo(x+14*s,y-8*s).lineTo(x+1*s,y-1*s).closePath().fill({color:"#496b43",alpha:.72});
  g.moveTo(x+ox*3*s,y+22*s).quadraticCurveTo(x+ox*17*s,y+26*s,x+ox*24*s,y+34*s).stroke({color:"#596846",width:2.4*s,alpha:.55});
 }
 // Small worn stepping stones form a subtle route through the clearing.
 for(let i=0;i<11;i++){const x=W*.22+((i%3)-1)*18+(i%2)*5,y=H*.18+i*(H*.064),rw=13+(i%3)*5,rh=6+(i%2)*3;g.moveTo(x-rw,y).lineTo(x-rw*.55,y-rh).lineTo(x+rw*.75,y-rh*.8).lineTo(x+rw,y+rh*.25).lineTo(x+rw*.35,y+rh).lineTo(x-rw*.8,y+rh*.7).closePath().fill({color:"#777660",alpha:.22});g.moveTo(x-rw*.5,y-rh*.35).lineTo(x+rw*.25,y-rh*.48).stroke({color:"#b7ad83",width:1,alpha:.16});}
 // Sparse ground plants and fallen leaves; keep the central combat lane clear.
 for(let i=0;i<22;i++){const x=(i*113+29)%Math.max(1,W),y=(i*167+51)%Math.max(1,H);g.moveTo(x,y+4).quadraticCurveTo(x-5,y-3,x-8,y-8).stroke({color:"#71875b",alpha:.30,width:1.35});g.moveTo(x,y+4).quadraticCurveTo(x+3,y-4,x+7,y-7).stroke({color:"#8c9b69",alpha:.26,width:1.35});if(i%4===0)g.ellipse(x+12,y+5,3,1.5).fill({color:"#a78a57",alpha:.26});}
 // Fireflies and tiny spirit flowers add depth without cluttering the combat lane.
 for(let i=0;i<15;i++){const x=(i*181+83)%Math.max(1,W),y=(i*239+61)%Math.max(1,H),pulse=.65+.35*Math.sin(performance.now()*.0018+i*1.7);gl.circle(x,y,5+pulse*2).fill({color:"#b6d98b",alpha:.055});gl.circle(x,y,1.7+pulse*.7).fill({color:"#c9e8a0",alpha:.42+pulse*.2});gl.circle(x-1,y-1,.7).fill({color:"#f0f3c0",alpha:.75});}
 // Subtle vignette at the edges.
 g.rect(0,0,W,18).fill({color:"#07110f",alpha:.20});g.rect(0,H-20,W,20).fill({color:"#07110f",alpha:.24});
 const alive=new Set();
 for(const e of state.enemies){
   alive.add(e);
   if((e.attackTell||0)>.42){const tell=Math.min(1,((e.attackTell||0)-.42)/.4);gl.circle(e.x,e.y+4,19+tell*7).stroke({color:"#ff987c",width:1.5+tell,alpha:.18+tell*.38});}
   let node=spriteNodes.get(e);
   if(!node){node=new PIXI.Sprite(artTextures[e.type]||artTextures.wolf);node.anchor.set(.5,.72);node.width=e.boss?58:36;node.height=e.boss?58:38;node._baseScaleX=node.scale.x;node._baseScaleY=node.scale.y;spriteLayer.addChild(node);spriteNodes.set(e,node)}
   node.x=e.x;node.y=e.y+Math.sin((e.anim||0))*2.2;node.scale.set(node._baseScaleX*(e.facing===-1?-1:1),node._baseScaleY*(1+Math.sin((e.anim||0)*2)*.012));node.alpha=e.hit>0?1:.96;node.tint=e.hit>0?0xffffff:0xffffff;node.x+=e.hit>0?Math.sin(performance.now()*.09)*1.5:0;const bob=Math.sin((e.anim||0)*1.7);node.y+=bob*(e.type==="wraith"?3:1.3);node.rotation=Math.sin((e.anim||0)*.7)*(e.type==="wraith"?.055:.025);
   if(e.hp<e.max){g.roundRect(e.x-12,e.y-23,24,3,1.5).fill("#321e25");g.roundRect(e.x-12,e.y-23,24*Math.max(0,e.hp/e.max),3,1.5).fill("#d76b69")}
   if(e.boss)gl.circle(e.x,e.y-5,25).fill({color:"#df6674",alpha:.20});
 }
 for(const [e,node] of spriteNodes){if(!alive.has(e)){spriteLayer.removeChild(node);node.destroy();spriteNodes.delete(e)}}
 const p=state.player;playerSprite.x=p.x;playerSprite.y=p.y+Math.sin(p.anim)* (p.moving?3.2:1.1);playerSprite.scale.set(playerBaseScaleX*(1+(p.attackPulse>0?Math.sin((.32-p.attackPulse)/.32*Math.PI)*.09:0)),playerBaseScaleY*(1+Math.sin(p.anim*2)*.035-(p.attackPulse>0?Math.sin((.32-p.attackPulse)/.32*Math.PI)*.06:0)));playerSprite.rotation=(p.moving?Math.sin(p.anim)*.045:Math.sin(performance.now()*.0012)*.018)+(p.swing>0?Math.sin((.32-p.swing)/.32*Math.PI)*.23:0);
 gl.ellipse(p.x,p.y+8,20,8).fill({color:"#e6c77d",alpha:.18});gl.ellipse(p.x,p.y+5,13,5).fill({color:"#a9e5ee",alpha:.16});const aura=10+Math.sin(performance.now()*.002)*2.5;gl.circle(p.x,p.y+1,aura).stroke({color:"#b9e9ee",width:1.2,alpha:.13});
 if(p.swing>0){const a=p.angle,progress=1-p.swing/.22;gl.arc(p.x,p.y,21,a-1.05+progress*.25,a+1.05+progress*.25).stroke({color:"#ffe2a0",width:5,alpha:Math.sin(progress*Math.PI)*.68});fx.arc(p.x,p.y,20,a-1.05+progress*.25,a+1.05+progress*.25).stroke({color:"#fff4c9",width:2,alpha:Math.sin(progress*Math.PI)})}
 for(const q of state.projectiles){gl.circle(q.x,q.y,q.size*3).fill({color:q.color,alpha:.32});fx.circle(q.x,q.y,q.size).fill(q.color);fx.circle(q.x,q.y,q.size*.45).fill("#ffffff")}
 particles.draw(fx);
 for(const f of state.effects){const alpha=Math.min(1,f.life*2);if(f.ring){const radius=(.42-f.life)*78;gl.circle(f.x,f.y,radius).stroke({color:f.color,width:2.5,alpha:alpha*.72});gl.circle(f.x,f.y,radius*.68).stroke({color:f.color,width:1,alpha:alpha*.32})}else if(f.slash){const a=f.angle||0;fx.arc(f.x,f.y,30,a-.95,a+.95).stroke({color:"#dff8ff",width:5,alpha:alpha*.9});gl.arc(f.x,f.y,36,a-.9,a+.9).stroke({color:"#8ed8f1",width:9,alpha:alpha*.24})}else{fx.circle(f.x,f.y,7+f.life*8).fill({color:f.color,alpha:alpha*.18})}}
 app.renderer.render(app.stage);
}
function loop(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;step(dt,now);particles.update(dt);draw(dt);updateHud();requestAnimationFrame(loop)}
function closePanel(){state.activeTab=null;$("panel").classList.remove("open");document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"))}
function renderPanel(){const tab=state.activeTab;if(!tab)return;let body="";if(tab==="bag"){body+='<div class="card"><div class="row"><b>角色屬性</b><span class="tag">無職業限制</span></div><div class="stat">攻擊 '+state.atk.toFixed(1)+'　防禦 '+state.def+'　生命 '+Math.round(state.maxHp)+'<br>攻速 '+state.attackSpeed.toFixed(2)+'　施法 '+state.castSpeed.toFixed(2)+'　移速 '+state.moveSpeed.toFixed(2)+'</div></div><div class="row"><b>裝備背包</b><span class="muted">'+state.inventory.length+' 件</span></div>';if(!state.inventory.length)body+='<div class="card muted">尚未取得裝備，繼續探索秘境尋找掉落。</div>';state.inventory.forEach(g=>{body+='<div class="item"><div class="row"><h3 class="'+g.rarity+'">'+g.name+'</h3><span class="tag">'+({common:"普通",rare:"稀有",epic:"史詩",legend:"傳說"}[g.rarity])+'</span></div><p>'+g.desc+'</p><div class="row"><span class="muted">'+(g.equipped?"已裝備":"未裝備")+'</span><button class="btn" data-equip="'+g.id+'" '+(g.equipped?"disabled":"")+'>'+(g.equipped?"使用中":"裝備")+'</button></div></div>'})}
if(tab==="talent"){body+='<div class="card"><b>天賦構築</b><p class="muted" style="font-size:11px">沒有職業限制，依照想玩的流派自由配置。</p><div class="stat">已配置 '+state.talents.length+' / 6 點</div></div>';talentDefs.forEach((t,i)=>{const on=state.talents.includes(i);body+='<div class="item"><div class="row"><h3>'+t.name+'</h3><button class="btn" data-talent="'+i+'" '+(on||state.talents.length>=6?"disabled":"")+'>'+(on?"已學習":"學習")+'</button></div><p>'+t.desc+'</p></div>'});body+='<button class="btn" id="resetTalents">重置天賦</button>'}
if(tab==="skill"){body+='<div class="card"><b>自動技能配置</b><p class="muted" style="font-size:11px">啟用技能會依照冷卻與觸發條件自動施放。</p><div class="stat">已啟用 '+state.skills.length+' 種技能</div></div>';skillDefs.forEach(s=>{const on=state.skills.includes(s.name);body+='<div class="item"><div class="row"><h3>'+s.name+'</h3><button class="btn" data-skill="'+s.name+'">'+(on?"停用":"啟用")+'</button></div><p>'+s.desc+'</p></div>'})}
$("panel").innerHTML='<div class="panelhead"><h2>'+(tab==="bag"?"背包":tab==="talent"?"天賦":"技能")+'</h2><button class="close" id="closePanel">返回戰鬥</button></div>'+body;$("panel").classList.add("open");$("closePanel").onclick=closePanel;
$("panel").querySelectorAll("[data-equip]").forEach(b=>b.onclick=()=>{const g=state.inventory.find(x=>x.id===b.dataset.equip);if(g)equip(g)});
$("panel").querySelectorAll("[data-talent]").forEach(b=>b.onclick=()=>{const i=+b.dataset.talent;if(!state.talents.includes(i)&&state.talents.length<6){state.talents.push(i);recalc();renderPanel();updateHud()}});
$("panel").querySelectorAll("[data-skill]").forEach(b=>b.onclick=()=>{const n=b.dataset.skill;state.skills=state.skills.includes(n)?state.skills.filter(x=>x!==n):[...state.skills,n];renderPanel()});
const reset=$("resetTalents");if(reset)reset.onclick=()=>{state.talents=[];recalc();renderPanel();updateHud()}}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{const t=b.dataset.tab;if(state.activeTab===t){closePanel();return}state.activeTab=t;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));renderPanel()}));
async function init(){recalc();updateHud();const ok=await setupRenderer();if(!ok)return;for(let i=0;i<4;i++)spawnEnemy();last=performance.now();requestAnimationFrame(loop)}
init();
})();
</script></body></html>
